<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio and checkboxes</title>
</head>
<body>
    <form enctype="multipart/form-data" method="get">
        <div><p>Gender</p>
            <input type="radio" name="gender" value="male">male
        <br>
        <input type="radio" name="any" value="female">female
        <br>
        </div>
        <div><p>Random</p>
            <input type="checkbox" name="animal" value="goat">goat
            <br>
            <input type="checkbox" name="animal" value="sedan">sedan
            <br>
        </div>
        <div>
            <input type="file" accept="">
        </div>
        <button type="submit">
            Submit
        </button>
        
 
    </form>
    
</body>
</html>
